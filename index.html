<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08050e"><title>MAQW</title>
<style>
:root{
--a1:#a78bfa;--a2:#7c3aed;--a3:#c026d3;--bg0:#08050e;--g1:rgba(139,92,246,.5);--g2:rgba(217,70,239,.24);--g3:rgba(91,33,182,.45);
--tx:#f3edff;--mu:#9b8fb8;--bd:rgba(167,139,250,.16);--c1:rgba(32,22,58,.92);--c2:rgba(16,11,30,.92);
--lq:rgba(24,15,46,.62);--lqs:rgba(24,15,46,.97);--inp:rgba(255,255,255,.06);--in1:#241a42;--in2:#181030;--ring:#120a24;
--brand:linear-gradient(90deg,#fff,#d8c8ff 55%,#f0abfc);--navon:#fff;--sh:rgba(0,0,0,.45);--dot:rgba(255,255,255,.06);
--stars:radial-gradient(1.2px 1.2px at 12% 22%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 78% 14%,rgba(255,255,255,.45),transparent),radial-gradient(1.4px 1.4px at 88% 62%,rgba(233,213,255,.5),transparent),radial-gradient(1px 1px at 30% 78%,rgba(255,255,255,.4),transparent),radial-gradient(1.2px 1.2px at 58% 40%,rgba(255,255,255,.35),transparent);
--fs:16px;--br:20px;
--bgimg:var(--stars),radial-gradient(70% 45% at 10% -5%,var(--g1),transparent 70%),radial-gradient(55% 40% at 105% 42%,var(--g2),transparent 70%),radial-gradient(70% 45% at 15% 105%,var(--g3),transparent 70%),var(--bg0)}
[data-theme=ocean]{--a1:#7dd3fc;--a2:#0ea5e9;--a3:#6366f1;--bg0:#060d1a;--g1:rgba(14,165,233,.42);--g2:rgba(99,102,241,.22);--g3:rgba(3,105,161,.4);--tx:#eaf6ff;--mu:#8fb0cc;--bd:rgba(125,211,252,.16);--c1:rgba(16,32,58,.92);--c2:rgba(8,18,34,.92);--lq:rgba(10,24,46,.62);--lqs:rgba(10,24,46,.97);--in1:#12304f;--in2:#0b1d33;--ring:#08142a}
[data-theme=sunset]{--a1:#fdba74;--a2:#f97316;--a3:#ec4899;--bg0:#12070a;--g1:rgba(249,115,22,.36);--g2:rgba(236,72,153,.25);--g3:rgba(127,29,29,.42);--tx:#fff1ea;--mu:#c9a193;--bd:rgba(253,186,116,.18);--c1:rgba(52,24,28,.92);--c2:rgba(28,12,16,.92);--lq:rgba(40,16,20,.62);--lqs:rgba(40,16,20,.97);--in1:#3b1c20;--in2:#26100f;--ring:#1c0c0e}
[data-theme=emerald]{--a1:#6ee7b7;--a2:#10b981;--a3:#14b8a6;--bg0:#04110d;--g1:rgba(16,185,129,.36);--g2:rgba(20,184,166,.2);--g3:rgba(6,78,59,.45);--tx:#eafff6;--mu:#8fc4b0;--bd:rgba(110,231,183,.16);--c1:rgba(14,44,36,.92);--c2:rgba(7,24,19,.92);--lq:rgba(8,34,27,.62);--lqs:rgba(8,34,27,.97);--in1:#10382d;--in2:#0a241d;--ring:#06180f}
[data-theme=rose]{--a1:#f9a8d4;--a2:#ec4899;--a3:#a855f7;--bg0:#14060f;--g1:rgba(236,72,153,.38);--g2:rgba(168,85,247,.25);--g3:rgba(131,24,67,.42);--tx:#fff0f8;--mu:#cc9ab8;--bd:rgba(249,168,212,.18);--c1:rgba(54,20,40,.92);--c2:rgba(30,10,22,.92);--lq:rgba(42,14,32,.62);--lqs:rgba(42,14,32,.97);--in1:#3a1830;--in2:#260f20;--ring:#1c0a16}
[data-theme=amoled]{--bg0:#000;--g1:transparent;--g2:transparent;--g3:transparent;--c1:#0f0b18;--c2:#0a0711;--lq:rgba(14,10,24,.7);--lqs:#0c0816;--in1:#15102a;--in2:#0e0a1c;--ring:#000;--a1:#a78bfa;--a2:#7c3aed;--a3:#c026d3;--tx:#f3edff;--mu:#9b8fb8}
[data-theme=light]{--a1:#8b5cf6;--a2:#7c3aed;--a3:#c026d3;--bg0:#f5f1ff;--g1:rgba(167,139,250,.45);--g2:rgba(244,114,182,.25);--g3:rgba(196,181,253,.5);--tx:#1c1233;--mu:#6e6390;--bd:rgba(124,58,237,.16);--c1:rgba(255,255,255,.97);--c2:rgba(248,244,255,.97);--lq:rgba(255,255,255,.7);--lqs:rgba(255,255,255,.98);--inp:rgba(124,58,237,.07);--in1:#fff;--in2:#f3eeff;--ring:#f5f1ff;--brand:linear-gradient(90deg,#4c1d95,#a21caf);--navon:#5b21b6;--sh:rgba(76,29,149,.18);--dot:rgba(76,29,149,.07);--stars:linear-gradient(transparent,transparent)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{color:var(--tx);font:var(--fs)/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg0);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg);transform:translateZ(0)}
::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:linear-gradient(160deg,var(--c1),var(--c2));border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px var(--sh)}
.lq{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02)),var(--lq);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 30px var(--sh)}
html.noblur .lq{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--lqs)}
html.noanim *{animation:none!important;transition:none!important}
.in{background:var(--inp);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:13px 16px;font:inherit;width:100%;outline:0;transition:border-color .15s}
.in:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.in::placeholder{color:var(--mu)}
.btn{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 52%),linear-gradient(135deg,var(--a1),var(--a2) 60%,var(--a3));border:0;color:#fff;border-radius:18px;padding:13px 18px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(124,58,237,.4);transition:transform .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.g{background:var(--inp);border:1px solid var(--bd);box-shadow:none;color:var(--tx)}
.btn.d{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);box-shadow:none;color:#fca5a5}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.sub{color:var(--mu);font-size:.875em}.grow{flex:1;min-width:0}.grow>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{display:flex;flex-direction:column;gap:12px}
.lbl{margin:14px 4px 8px;font-weight:600;letter-spacing:.3px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 24px rgba(167,139,250,.5),0 8px 20px rgba(124,58,237,.45)}
.logo svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:27px;font-weight:800;letter-spacing:2px;line-height:1;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#auth{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#auth .card{width:100%;max-width:380px;padding:26px;border-radius:34px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 70px rgba(124,58,237,.3),0 20px 50px var(--sh)}
#auth h1{margin:0 0 2px;font-size:34px;font-weight:800;letter-spacing:2px;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#err{color:#fda4af;font-size:14px;min-height:20px}
#sw{background:none;border:0;color:var(--mu);padding:6px}

#app{position:absolute;inset:0;display:none}
#top{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;gap:13px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(var(--bg0) 55%,transparent)}
.view{position:absolute;inset:0;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top,0px)) 16px 120px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block;animation:vin .28s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:30px;font-weight:800;margin:0 0 14px;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
#chips button{flex:none;background:var(--inp);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;font-size:.9em;color:var(--mu)}
#chips button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.row{display:flex;gap:14px;align-items:center;padding:12px 15px;border-radius:28px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;content-visibility:auto;contain-intrinsic-size:76px;transition:transform .12s}
.row:active{transform:scale(.985)}
.row b{font-size:1.03em}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.row .meta small{font-size:.75em;color:var(--mu)}
.pv.tp{color:var(--a1)}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 7px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.badge.m{background:var(--mu);opacity:.7}
.empty{color:var(--mu);text-align:center;margin-top:56px;padding:0 24px}
.empty::before{content:"💬";display:block;font-size:46px;margin-bottom:10px}
.avw{position:relative;flex:none}
.av{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--a2),var(--a3)) center/cover;display:grid;place-items:center;font-weight:700;color:#fff;box-shadow:0 0 0 2px var(--ring),0 0 0 3.5px rgba(167,139,250,.55)}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2.5px solid var(--ring)}
.pc{border-radius:32px;overflow:hidden;padding-bottom:18px;text-align:center;margin-bottom:14px}
.banner{position:relative;height:140px;background:linear-gradient(135deg,var(--a2),var(--a3)) center/cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(18,10,36,.8))}
.pc .avw{margin:-44px auto 8px;position:relative;z-index:1}
.pc h3{margin:0;font-size:1.35em}.pc p{margin:8px 18px 0}
.pc .on{color:#4ade80}
.fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;z-index:6;font-size:24px;padding:0;display:none}

nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;padding:7px;border-radius:36px;z-index:5}
nav button{flex:1;position:relative;background:none;border:0;color:var(--mu);font-size:11.5px;font-weight:600;padding:9px 0 12px;border-radius:26px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--navon);background:linear-gradient(180deg,rgba(196,181,253,.3),rgba(124,58,237,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
nav button.on::after{content:"";position:absolute;bottom:4px;width:20px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--a1),var(--a2))}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;display:none;place-items:center;padding:0 5px}

/* chat */
#chatv{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bgimg);z-index:10}
html[data-wall=plain] #chatv{background:var(--bg0)}
html[data-wall=dots] #chatv{background:radial-gradient(var(--dot) 1.6px,transparent 1.7px) 0 0/22px 22px,var(--bgimg)}
#chead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;border-radius:0 0 28px 28px}
.back,.ibtn{background:none;border:0;font-size:30px;line-height:1;padding:2px 8px;color:var(--tx)}
.ibtn{font-size:20px}
.hinfo{cursor:pointer}.hinfo b{font-size:1.05em}.hinfo .sub.on{color:#4ade80}.hinfo .sub.tp{color:var(--a1)}
#pin,#sbar,#rbar,#ro{display:none;align-items:center;gap:10px;margin:8px 12px 0;padding:8px 12px;border-radius:18px;font-size:.9em}
#pin{cursor:pointer}#pin b{color:var(--a1)}
#msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.mrow{display:flex;flex-direction:column;align-items:flex-start;transition:background .6s}
.mrow.me{align-items:flex-end}
.mrow.flash .msg{box-shadow:0 0 0 3px var(--a1)}
.msg{max-width:min(82%,520px);padding:8px 12px 6px;border-radius:var(--br) var(--br) var(--br) 6px;background:linear-gradient(160deg,var(--in1),var(--in2));border:1px solid var(--bd);overflow-wrap:anywhere;font-size:.97em;position:relative}
.msg.me{border-radius:var(--br) var(--br) 6px var(--br);border-color:transparent;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%),linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(124,58,237,.3)}
.msg.im{padding:4px 4px 6px}.msg.im .tx,.msg.im .meta,.msg.im .rcs,.msg.im .an,.msg.im .fw,.msg.im .rq{margin-left:8px;margin-right:8px}
.msg a{color:inherit;text-decoration:underline}
.msg code{background:rgba(0,0,0,.25);padding:1px 5px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:.92em}
.an{font-weight:700;font-size:.85em;margin-bottom:2px}
.fw{font-size:.8em;opacity:.8;margin-bottom:3px;font-style:italic}
.rq{border-left:3px solid var(--a1);background:rgba(0,0,0,.18);border-radius:8px;padding:4px 8px;margin-bottom:5px;font-size:.88em;cursor:pointer;display:flex;flex-direction:column}
.msg.me .rq{border-color:#fff}
.rq b{font-size:.95em}.rq span{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.tx{white-space:pre-wrap}
.pimg{display:block;max-width:100%;max-height:340px;border-radius:calc(var(--br) - 6px);cursor:zoom-in}
.meta{display:flex;gap:5px;justify-content:flex-end;font-size:.72em;opacity:.7;margin-top:2px}
.meta .rd{color:#7dd3fc;opacity:1}
.rcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rc{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:1px 8px;font-size:.85em}
.rc.mine{background:rgba(255,255,255,.34)}
.fc{display:flex;align-items:center;gap:10px;min-width:200px}
.fic{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.22);font-size:18px;flex:none;color:inherit}
.fi{min-width:0;display:flex;flex-direction:column}.fi b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fi .sub{color:inherit;opacity:.7}
.wv{display:flex;align-items:center;gap:2px;height:26px}.wv i{width:3px;border-radius:2px;background:currentColor;opacity:.7}
.fslot audio{width:230px;max-width:100%;margin-top:6px}.fslot video{width:100%;max-width:300px;border-radius:14px;margin-top:6px}
.dsep,.usep{align-self:center;margin:10px 0 4px;padding:3px 12px;border-radius:12px;background:var(--lq);font-size:.78em;color:var(--mu)}
.usep{background:var(--a2);color:#fff}
.more{align-self:center;background:var(--inp);border:1px solid var(--bd);border-radius:16px;padding:6px 14px;font-size:.85em;color:var(--mu)}
#tobtm{position:absolute;right:16px;bottom:100px;width:44px;height:44px;border-radius:50%;display:none;place-items:center;font-size:18px;border:1px solid var(--bd);z-index:3}
#tobtm i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--a2);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
#rbar button{margin-left:auto;background:none;border:0;font-size:18px}
#rbar div{min-width:0;border-left:3px solid var(--a1);padding-left:8px}
#mf{display:flex;align-items:flex-end;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;margin-top:8px}
#mt{resize:none;max-height:120px;border-radius:22px;padding:12px 15px;line-height:1.3}
#mf .ibtn{font-size:22px;padding:10px 6px;flex:none}
#snd{width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
#snd svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#snd .s-mic{display:none}#snd.mic .s-mic{display:block}#snd.mic .s-send{display:none}
#emo{display:none;flex-wrap:wrap;gap:2px;max-height:190px;overflow-y:auto;padding:8px 10px;margin:0 10px 6px;border-radius:20px}
#emo button{background:none;border:0;font-size:26px;width:12.5%;padding:4px 0}
#recbar{display:none;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;margin-top:8px}
#recbar i{width:12px;height:12px;border-radius:50%;background:#ef4444;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#ro{justify-content:center;margin-bottom:calc(12px + env(safe-area-inset-bottom,0px))}

/* overlays */
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,3,14,.68);z-index:30}
#ov.b{align-items:flex-end}
#ov>.box{width:100%;max-width:400px;max-height:88vh;overflow-y:auto}
.mdl{padding:18px;border-radius:30px}.mdl h3{margin:0 0 4px}
.menu{border-radius:28px;padding:8px;margin-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.mi{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 14px;border-radius:18px;text-align:left}
.mi:active{background:var(--inp)}.mi.dng{color:#fca5a5}.mi .ic{width:24px;text-align:center}
.rxs{display:flex;justify-content:space-between;padding:6px 6px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.rx{background:none;border:0;font-size:26px;padding:2px 4px}
.chk{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px}
.chk input{width:20px;height:20px;accent-color:var(--a2)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;padding:10px}
#viewer img{max-width:100%;max-height:82vh;border-radius:12px}
#viewer .bar{margin-top:14px;display:flex;gap:12px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;border-radius:20px;z-index:60;display:none;max-width:88%;text-align:center;font-size:.92em}

/* settings */
.sec{border-radius:28px;padding:6px 14px;margin-bottom:14px}
.st{padding:12px 2px 4px;font-weight:700;color:var(--a1);font-size:.85em;letter-spacing:.8px;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--bd)}
.st+.srow{border-top:0}
.srow.col2{flex-direction:column;align-items:stretch;gap:8px}
.srow.btnr{cursor:pointer}.srow.dng b{color:#fca5a5}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--inp);border:1px solid var(--bd);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw input:checked+i{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw input:checked+i::after{transform:translateX(20px)}

  const nm=mk("Название",60),ds=mk("Описание (необязательно)",200),hd=mk("@ссылка (необязательно, делает публичным)",24);hd.autocapitalize="none";
  b.append(nm,ds,hd,h("div","sub",kind==="channel"?"Писать в канал сможешь только ты. Остальные читают.":"Пиши и приглашай — группа общая."));
  const ids=prof.contacts||[],us=await Promise.all(ids.map(i=>getUser(i,60000))),pick=new Set();
  if(us.length){b.append(h("div","sub lbl","Добавить участников"));us.forEach(u=>{const l=h("label","chk"),i=h("input");i.type="checkbox";i.onchange=()=>i.checked?pick.add(u.id):pick.delete(u.id);l.append(i,av(u,36),h("span","",u.name));b.append(l)})}
  const er=h("div","sub");er.style.color="#fda4af";const go=h("button","btn","Создать");
  go.onclick=async()=>{
    const name=nm.value.trim(),handle=hd.value.trim().replace(/^@/,"").toLowerCase();er.textContent="";
    if(!name)return er.textContent="Введи название";
    if(handle&&!/^[a-z][a-z0-9_]{3,23}$/.test(handle))return er.textContent="Ссылка: 4–24 символа, латиница, цифры, _ (с буквы)";
    go.disabled=true;
    try{
      const ref=doc(collection(db,"chats")),data={type:kind,title:name,desc:ds.value.trim(),owner:uid,admins:[uid],members:[uid,...pick],public:!!handle,avatar:"",last:"",lastAt:serverTimestamp(),createdAt:serverTimestamp()};
      if(handle)data.handle=handle;
      if(handle){await runTransaction(db,async t=>{const hr=doc(db,"handles",handle);if((await t.get(hr)).exists()||(await t.get(doc(db,"usernames",handle))).exists())throw new Error("taken");t.set(hr,{h:handle,cid:ref.id,owner:uid,kind,name});t.set(ref,data)})}
      else await setDoc(ref,data);
      chats.set(ref.id,{id:ref.id,...data,lastAt:null,createdAt:null});closeOv();openChat(ref.id);
    }catch(e){er.textContent=e.message==="taken"?"Ссылка @"+handle+" уже занята":"Ошибка: "+(e.code||e.message);go.disabled=false}
  };
  b.append(er,go);ov(b);
}
async function openInfo(){
  const c=cur;if(!c||!c.data)return;const d=c.data,own=d.owner===uid;closeOv();
  const b=h("div","glass mdl col"),top=h("div");top.style.textAlign="center";
  const a=av({name:d.title,avatar:d.avatar,icon:d.avatar?"":(c.type==="channel"?"📢":"👥")},84);a.style.margin="0 auto 8px";top.append(a,h("h3","",d.title));
  if(d.handle)top.append(h("div","sub","@"+d.handle+" · публичный"));
  if(d.desc)top.append(h("p","",d.desc));
  top.append(h("div","sub",(c.type==="channel"?"Подписчиков: ":"Участников: ")+d.members.length));b.append(top);
  if(own){
    const x=h("button","btn g","🖼 Сменить аватар");x.onclick=()=>pickImg(async f=>{try{await updateDoc(CH(c.cid),{avatar:await pic(f,256,256)});closeOv()}catch(e){toast("Ошибка: "+e.code)}});
    const y=h("button","btn g","✏️ Название и описание");y.onclick=()=>{const t=prompt("Название",d.title);if(t&&t.trim())updateDoc(CH(c.cid),{title:t.trim().slice(0,60)}).catch(e=>toast("Ошибка: "+e.code));const s=prompt("Описание",d.desc||"");if(s!=null)updateDoc(CH(c.cid),{desc:s.trim().slice(0,200)}).catch(()=>{});closeOv()};
    b.append(x,y);
  }
  if(own||c.type==="group"){const z=h("button","btn g","➕ Добавить участников");z.onclick=addMembers;b.append(z)}
  b.append(h("div","sub lbl","Участники"));
  const us=await Promise.all(d.members.slice(0,60).map(i=>getUser(i,60000)));
  us.forEach(u=>{const r=urow(u,u.id===d.owner?"владелец":seen(u));r.style.marginBottom="6px";r.onclick=()=>{if(own&&u.id!==uid)menu([{i:"👤",t:"Профиль",f:()=>openProfile(u.id)},{i:"🚫",t:"Исключить",d:1,f:()=>updateDoc(CH(c.cid),{members:arrayRemove(u.id)}).then(()=>toast("Исключён")).catch(e=>toast("Ошибка: "+e.code))}]);else openProfile(u.id)};b.append(r)});
  ov(b);
}
async function addMembers(){
  const c=cur,d=c.data;closeOv();const ids=(prof.contacts||[]).filter(i=>!d.members.includes(i));
  if(!ids.length)return toast("Некого добавлять — все контакты уже здесь");
  const us=await Promise.all(ids.map(i=>getUser(i,60000))),pick=new Set(),b=h("div","glass mdl col");b.append(h("h3","","Добавить участников"));
  us.forEach(u=>{const l=h("label","chk"),i=h("input");i.type="checkbox";i.onchange=()=>i.checked?pick.add(u.id):pick.delete(u.id);l.append(i,av(u,36),h("span","",u.name));b.append(l)});
  const go=h("button","btn","Добавить");go.onclick=async()=>{if(!pick.size)return;try{await updateDoc(CH(c.cid),{members:arrayUnion(...pick)});closeOv();toast("Добавлено")}catch(e){toast("Ошибка: "+e.code)}};b.append(go);ov(b);
}

/* ================= профиль ================= */
function copyTxt(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Скопировано")).catch(()=>toast("Не удалось скопировать"));else toast("Не удалось скопировать")}
function renderProfile(){
  const b=E("pbox");b.replaceChildren();const u=prof;
  const hero=h("div","hero"),bn=h("div","hbanner");if(u.banner)bn.style.backgroundImage="url("+u.banner+")";
  const a=av(u,120);a.classList.add("hav");a.onclick=()=>u.avatar&&viewImg(u.avatar);
  hero.append(bn,a,h("h1","",u.name),h("div","st2 on","в сети"));
  const pa=h("div","pact"),pb=(ic,t,f)=>{const x=h("button","pab");x.append(h("span","",ic),h("div","",t));x.onclick=f;pa.append(x)};
  pb("📷","Фото",()=>pickImg(f=>setImg("avatar",f,256,256)));pb("✏️","Изменить",editProfile);pb("⚙️","Настройки",()=>tab("settings"));
  const ic=h("div","icard glass"),row=(v,l,f)=>{const r=h("div","irow");r.append(h("b","",v),h("div","sub",l));if(f)r.onclick=f;ic.append(r)};
  row(u.bio||"Не указано","О себе",editProfile);
  row("@"+u.username,"Юзернейм · нажми, чтобы скопировать",()=>copyTxt("@"+u.username));
  const bd=u.bday?new Date(u.bday+"T12:00:00"):null;
  row(bd&&!isNaN(bd)?bd.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}):"Не указан","День рождения",editProfile);
  row((auth.currentUser||{}).email||"—","Почта · видна только тебе");
  if(u.createdAt&&u.createdAt.toDate)row(u.createdAt.toDate().toLocaleDateString("ru-RU",{month:"long",year:"numeric"}),"В MAQW с");
  const sh=h("button","btn g","🔗 Поделиться профилем");sh.style.cssText="margin:0 16px;width:calc(100% - 32px)";
  sh.onclick=()=>share(location.origin+location.pathname+"#u="+u.username,"Мой профиль в MAQW: @"+u.username);
  b.append(hero,pa,ic,sh);
}
async function setImg(field,file,w,hh){try{const data=await pic(file,w,hh);await updateDoc(doc(db,"users",uid),{[field]:data});prof[field]=data;renderProfile();buildSettings();toast("Готово")}catch(e){toast("Ошибка: "+(e.code||e.message))}}
function editProfile(){
  closeOv();const b=h("div","glass mdl col");b.append(h("h3","","Изменить профиль"));
  const mk=(p,v,m)=>{const i=h("input","in");i.placeholder=p;i.value=v||"";i.maxLength=m;return i};
  const nm=mk("Имя",prof.name,30),bio=mk("О себе",prof.bio,150),bd=h("input","in");bd.type="date";bd.value=prof.bday||"";
  const ab=h("button","btn g","📷 Сменить аватар");ab.onclick=()=>pickImg(f=>setImg("avatar",f,256,256));
  const bb=h("button","btn g","🖼 Сменить баннер");bb.onclick=()=>pickImg(f=>setImg("banner",f,900,360));
  const sv=h("button","btn","Сохранить");
  sv.onclick=async()=>{const name=nm.value.trim()||prof.username,bi=bio.value.trim(),bday=bd.value;try{await updateDoc(doc(db,"users",uid),{name,bio:bi,bday});Object.assign(prof,{name,bio:bi,bday});renderProfile();buildSettings();closeOv();toast("Сохранено")}catch(e){toast("Ошибка: "+e.code)}};
  b.append(nm,bio,h("div","sub","День рождения"),bd,ab,bb);
  if(prof.banner){const rb=h("button","btn g","Убрать баннер");rb.onclick=async()=>{try{await updateDoc(doc(db,"users",uid),{banner:""});prof.banner="";renderProfile();closeOv()}catch(e){toast("Ошибка: "+e.code)}};b.append(rb)}
  b.append(sv);ov(b);
}

/* ================= настройки ================= */
function page(title,build){
  const hd=E("sph");hd.replaceChildren();const b=h("button","back","‹");b.onclick=closePage;hd.append(b,h("b","",title));
  const body=E("spb");body.replaceChildren();build(body);body.scrollTop=0;E("sp").style.display="flex";
}
function closePage(){E("sp").style.display="none"}
const secBox=(box,t)=>{const s=h("div","sec glass");if(t)s.append(h("div","st",t));box.append(s);return s};
function swRow(s,key,label,desc,cb){const r=h("label","srow"),t=h("div","grow");t.append(h("b","",label));if(desc)t.append(h("div","sub",desc));t.firstChild.style.whiteSpace="normal";const i=h("input");i.type="checkbox";i.checked=!!S[key];i.onchange=()=>{S[key]=i.checked;saveS();cb&&cb(i)};const k=h("span","sw");k.append(i,h("i"));r.append(t,k);s.append(r)}
function segRow(s,key,label,opts){const r=h("div","srow col2");r.append(h("b","",label));const g=h("div","seg");opts.forEach(([v,t])=>{const b=h("button",S[key]===v?"on":"",t);b.onclick=()=>{S[key]=v;saveS();g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")};g.append(b)});r.append(g);s.append(r)}
function actRow(s,t,f,d){const r=h("div","srow btnr"+(d?" dng":""));r.append(h("b","",t));r.onclick=f;s.append(r)}
function pgLook(){page("Оформление",b=>{
  b.append(h("div","st sti","Тема"));
  const g=h("div","tgrid");
  THEMES.forEach(([id,n])=>{const c=h("button","tcard"+(S.theme===id?" on":""));c.dataset.theme=id;c.append(h("i","b1"),h("i","b2"),h("span","",n));c.onclick=()=>{S.theme=id;saveS();g.querySelectorAll(".tcard").forEach(x=>x.classList.toggle("on",x===c))};g.append(c)});
  b.append(g);
  const s=secBox(b,"Эффекты");swRow(s,"blur","Жидкое стекло","Выключи, если телефон тормозит");swRow(s,"anim","Анимации");
})}
function pgChats(){page("Настройки чатов",b=>{
  const pv=h("div","pvw"),m=(me,t,tm2)=>{const w=h("div","mrow"+(me?" me":"")),x=h("div","msg"+(me?" me":"")),mt=h("div","meta");mt.append(h("span","",tm2));if(me)mt.append(h("span","rd","✓✓"));x.append(h("div","tx",t),mt);w.append(x);pv.append(w)};
  m(0,"Привет! Как тебе новый вид чата?","12:30");m(1,"Огонь 🔥 Всё читается отлично","12:31");b.append(pv);
  const s=secBox(b,"Вид");
  segRow(s,"fs","Размер текста",[[14,"Мелкий"],[16,"Обычный"],[18,"Крупный"]]);
  segRow(s,"br","Скругление сообщений",[[10,"Острые"],[20,"Средние"],[26,"Круглые"]]);
  segRow(s,"wall","Фон чата",[["glow","Свечение"],["plain","Однотонный"],["dots","Узор"]]);
  const s2=secBox(b,"Отправка");swRow(s2,"enter","Enter отправляет","На компьютере. Shift+Enter — новая строка");
})}
function pgNotif(){page("Уведомления и звук",b=>{
  const s=secBox(b);
  swRow(s,"sound","Звук сообщений");swRow(s,"vib","Вибрация");
  swRow(s,"notif","Уведомления в браузере","Работают, пока вкладка открыта",async i=>{if(i.checked){if(!window.Notification){toast("Браузер не поддерживает уведомления");i.checked=S.notif=false;saveS();return}const p=await Notification.requestPermission();if(p!=="granted"){i.checked=S.notif=false;saveS();toast("Разрешение не выдано")}}});
  b.append(h("p","sub hint","Звук для отдельного чата выключается долгим нажатием на чат в списке."));
})}
function pgPriv(){page("Конфиденциальность",b=>{
  const s=secBox(b),r=h("label","srow"),t=h("div","grow");t.append(h("b","","Скрыть «в сети»"),h("div","sub","Другие увидят «был(а) недавно». Ты их статус тоже не будешь обновлять."));t.firstChild.style.whiteSpace="normal";
  const i=h("input");i.type="checkbox";i.checked=!!prof.hideSeen;i.onchange=async()=>{try{await updateDoc(doc(db,"users",uid),{hideSeen:i.checked});prof.hideSeen=i.checked}catch(e){i.checked=!i.checked;toast("Ошибка: "+e.code)}};
  const k=h("span","sw");k.append(i,h("i"));r.append(t,k);s.append(r);
  b.append(h("p","sub hint","Почту видишь только ты. Другие люди видят имя, @юзернейм, аватар, баннер, описание и день рождения."));
})}
function pgData(){page("Данные и память",b=>{
  const s=secBox(b,"На этом устройстве");
  const n=h("div","srow col2");n.append(h("b","","Чатов: "+chats.size),h("div","sub","Закреплено: "+Lx.pin.length+" · без звука: "+Lx.mute.length+" · черновиков: "+Object.keys(Lx.drafts).length));s.append(n);
  actRow(s,"✍️ Очистить черновики",()=>{Lx.drafts={};saveL();toast("Черновики удалены")});
  actRow(s,"♻️ Сбросить локальные настройки",()=>{if(!confirm("Сбросить тему, закрепы, черновики и скрытые чаты на этом устройстве?"))return;localStorage.removeItem("maqw_s");localStorage.removeItem("maqw_l_"+uid);location.reload()},true);
  b.append(h("p","sub hint","Сообщения и файлы хранятся в облаке Firebase, здесь только настройки."));
})}
function pgAbout(){page("О MAQW",b=>{
  const c=h("div","sec glass col");c.style.cssText="padding:20px;text-align:center";
  const l=h("div","logo");l.style.margin="0 auto";l.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>';
  c.append(l,h("h3","","MAQW 2.0"),h("div","sub","Свой мессенджер: личные чаты, группы и каналы, фото, видео, музыка, файлы, голосовые. Бесплатно на Firebase и GitHub Pages. Файлы до 6 МБ хранятся прямо в базе."));b.append(c);
})}
function pgAcc(){page("Аккаунт и безопасность",b=>{
  const s=secBox(b),m=h("div","srow col2");m.append(h("div","sub","Почта"),h("b","",(auth.currentUser||{}).email||""));s.append(m);
  actRow(s,"🔑 Сменить пароль по почте",async()=>{try{await sendPasswordResetEmail(auth,auth.currentUser.email);toast("Письмо отправлено на почту")}catch(e){toast("Ошибка: "+e.code)}});
  actRow(s,"🗑 Удалить аккаунт",delAccount,true);
})}
function buildSettings(){
  const box=E("sbox");box.replaceChildren();
  const me=h("div","shead glass");me.append(av(prof,64));
  const t=h("div","grow");t.append(h("b","",prof.name),h("div","sub","@"+prof.username),h("div","sub",(auth.currentUser||{}).email||""));
  me.append(t,h("span","chev","›"));me.onclick=()=>tab("profile");box.append(me);
  const list=items=>{const g=h("div","sgrp glass");items.forEach(([ic,col,t,f,d,sub])=>{const r=h("div","sr2"+(d?" dng":"")),i=h("div","sic",ic);i.style.background=col;const x=h("div","grow");x.append(h("b","",t));if(sub)x.append(h("div","sub",sub));r.append(i,x);if(!d)r.append(h("span","chev","›"));r.onclick=f;g.append(r)});box.append(g)};
  list([["🎨","linear-gradient(135deg,#a78bfa,#7c3aed)","Оформление",pgLook,0,"Тема, стекло, анимации"],
        ["💬","linear-gradient(135deg,#60a5fa,#2563eb)","Настройки чатов",pgChats,0,"Текст, фон, отправка"],
        ["🔔","linear-gradient(135deg,#fb7185,#e11d48)","Уведомления и звук",pgNotif],
        ["🔒","linear-gradient(135deg,#4ade80,#16a34a)","Конфиденциальность",pgPriv,0,"Статус «в сети»"]]);
  list([["🗄","linear-gradient(135deg,#fdba74,#ea580c)","Данные и память",pgData],
        ["🔗","linear-gradient(135deg,#67e8f9,#0891b2)","Пригласить друзей",shareApp],
        ["ℹ️","linear-gradient(135deg,#94a3b8,#475569)","О MAQW",pgAbout]]);
  list([["🔑","linear-gradient(135deg,#fcd34d,#d97706)","Аккаунт и безопасность",pgAcc],
        ["🚪","linear-gradient(135deg,#f87171,#b91c1c)","Выйти из аккаунта",()=>signOut(auth),1]]);
}
async function delAccount(){
  if(!confirm("Удалить аккаунт навсегда? Это нельзя отменить."))return;
  const pw=prompt("Введи пароль для подтверждения");if(!pw)return;
  try{
    const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,pw));
    await deleteDoc(doc(db,"usernames",prof.username)).catch(()=>{});await deleteDoc(doc(db,"users",uid));await deleteUser(u);
  }catch(e){toast(AE[e.code]||"Ошибка: "+(e.code||e.message),4000)}
}
